[package]
name = "worker-size"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
base64 = "0.22"
