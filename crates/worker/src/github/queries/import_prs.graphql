query ImportPrs($q: String!, $first: Int!, $after: String) {
  search(type: ISSUE, query: $q, first: $first, after: $after) {
    issueCount
    nodes {
      ... on PullRequest {
        id
        number
        createdAt
        mergedAt
        closedAt
        additions
        deletions
        changedFiles
        headRefName
        repository {
          id
          nameWithOwner
          stargazerCount
          primaryLanguage {
            name
          }
        }
        closingIssuesReferences(first: 5) {
          nodes {
            number
            repository {
              nameWithOwner
            }
          }
        }
        reviews(states: [CHANGES_REQUESTED]) {
          totalCount
        }
        timelineItems(itemTypes: [ISSUE_COMMENT, PULL_REQUEST_REVIEW], first: 20) {
          nodes {
            ... on IssueComment {
              createdAt
              author {
                __typename
                login
              }
            }
            ... on PullRequestReview {
              createdAt
              submittedAt
              author {
                __typename
                login
              }
            }
          }
          pageInfo {
            endCursor
            hasNextPage
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
  rateLimit {
    cost
    remaining
    resetAt
  }
}
