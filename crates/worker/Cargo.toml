[package]
name = "radar-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "radar_worker"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
domain.workspace = true
getrandom = "0.4"
hmac = "0.13"
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
wasm-bindgen.workspace = true
worker = { workspace = true, features = ["d1"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = []
probe = []
sql-dump = []

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }

[[example]]
name = "emit_sql"
required-features = ["sql-dump"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
