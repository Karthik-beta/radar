[workspace]
resolver = "2"
members = ["crates/domain", "crates/worker", "crates/web"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = "0.8.7"
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = "0.2"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
leptos_router = "0.8"
tw_merge = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
